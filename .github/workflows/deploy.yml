name: Build feed and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build feed
        run: |
          export FEED_FALLBACK_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/feed.json"
          node scripts/build-feed.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Package the TV app
        # Unsigned on purpose: the installer signs it with your own Samsung certificate.
        run: cd tizen && zip -q -r -X ../app/TVHome.wgt . -x '.*'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
