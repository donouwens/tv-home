<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>TV Home</title>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05080F; }
  #app { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
  #offline { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; color: #F4F2EE; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; }
  #offline h1 { margin: 0; font-size: 44px; font-weight: 500; }
  #offline p { margin: 0; font-size: 26px; color: #C5CDD8; }
</style>
</head>
<body>
<iframe id="app" src="about:blank" allow="autoplay; fullscreen; encrypted-media"></iframe>
<div id="offline" role="alert">
  <h1>The home screen can’t load right now</h1>
  <p>Check the TV’s internet connection. Press OK to try again.</p>
</div>
<script src="js/config.js"></script>
<script src="js/wrapper.js"></script>
</body>
</html>
